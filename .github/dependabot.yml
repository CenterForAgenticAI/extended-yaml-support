version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      eslint-major:
        patterns:
          - eslint
          - "@eslint/js"
        update-types:
          - major
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Keep API types aligned with the minimum supported VS Code version.
      - dependency-name: "@types/vscode"
      # Runtime and compiler major upgrades require coordinated compatibility checks.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
