name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Verify registry signatures
        run: npm audit signatures
      - name: Run quality gates
        run: npm run check
      - name: Upload tested extension package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-yaml-support-${{ github.sha }}
          path: artifacts/extended-yaml-support.vsix
          if-no-files-found: error
          retention-days: 14

  extension-host:
    name: VS Code ${{ matrix.vscode-version }} ${{ matrix.mode }} smoke test
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: development extension
            packaged: false
            vscode-version: "1.85.0"
          - mode: packaged VSIX
            packaged: true
            vscode-version: stable
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download tested extension package
        if: ${{ matrix.packaged }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: extended-yaml-support-${{ github.sha }}
          path: artifacts
      - name: Run development extension-host smoke test
        if: ${{ !matrix.packaged }}
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a npm run test:extension
      - name: Run packaged extension-host smoke test
        if: ${{ matrix.packaged }}
        env:
          VSCODE_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a npm run test:package
